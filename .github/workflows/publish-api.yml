name: Publish Paper API to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to upload (for example, 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          validate-wrappers: true

      - name: Upload API to Central Portal
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          version="${PACKAGE_VERSION#v}"
          if [[ -z "$version" ]]; then
            echo "A Maven version is required."
            exit 1
          fi
          for required in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required publishing secret: $required"
              exit 1
            fi
          done
          ./gradlew :chat-buttons-api:publishToMavenCentral -PapiVersion="$version"
