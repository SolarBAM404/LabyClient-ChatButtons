name: Publish Paper API

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to publish (for example, 1.0.0-SNAPSHOT)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          validate-wrappers: true

      - name: Publish API to GitHub Packages
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${PACKAGE_VERSION#v}"
          ./gradlew :chat-buttons-api:publish -PapiVersion="$version"
